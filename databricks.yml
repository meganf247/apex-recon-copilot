bundle:
  name: apex-recon-copilot

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all Apex Exchange reconciliation assets
    default: apex_recon

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-megant-fevm.cloud.databricks.com
      # Code goes to a visible folder in your home directory; deployment state stays under .bundle.
      file_path: /Workspace/Users/${workspace.current_user.userName}/apex-recon-copilot
