resources:
  jobs:
    apex_recon_build:
      name: apex-recon-build
      description: End-to-end build for the Apex Exchange CTV Revenue Reconciliation Copilot.
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/01_generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              seed: "42"
        - task_key: ingest_and_reconcile
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.apex_recon_pipeline.id}
            full_refresh: true
        - task_key: train_root_cause_model
          depends_on:
            - task_key: ingest_and_reconcile
          notebook_task:
            notebook_path: ../src/03_train_root_cause.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: score_and_draft_disputes
          depends_on:
            - task_key: train_root_cause_model
          notebook_task:
            notebook_path: ../src/04_score_and_draft.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: apply_governance
          depends_on:
            - task_key: score_and_draft_disputes
          sql_task:
            warehouse_id: 75019f3de4c19846
            file:
              path: ../src/02_governance.sql
        - task_key: refresh_lakebase_queue
          depends_on:
            - task_key: score_and_draft_disputes
          pipeline_task:
            pipeline_id: 248ca05a-ee23-46ed-a2c0-0e442bd0434b  # managed sync: gold.case_workbench -> Lakebase serving.case_workbench
        - task_key: sync_case_status_to_uc
          depends_on:
            - task_key: refresh_lakebase_queue
          notebook_task:
            notebook_path: ../src/07_sync_case_status.py
            base_parameters:
              catalog: ${var.catalog}
