resources:
  jobs:
    apex_recon_build:
      name: apex-recon-build
      description: Apex Exchange CTV revenue reconciliation, end to end (4 steps).
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../src/01_generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              seed: "42"
        - task_key: pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.apex_recon_pipeline.id}
            full_refresh: true
        - task_key: ml_and_disputes
          depends_on:
            - task_key: pipeline
          notebook_task:
            notebook_path: ../src/03_ml_and_disputes.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: publish
          depends_on:
            - task_key: ml_and_disputes
          sql_task:
            warehouse_id: 93d767746e247a90
            file:
              path: ../src/04_publish.sql
